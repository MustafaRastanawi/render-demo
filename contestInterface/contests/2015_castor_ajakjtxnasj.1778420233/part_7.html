el);\\r\\n         }\\r\\n         self.updateLayout();\\r\\n      }, 100);\\r\\n\\r\\n      $('#tabsContainer').after('&lt;div id=\\\&quot;popupMessage\\\&quot;&gt;&lt;/div&gt;');\\r\\n   },\\r\\n\\r\\n   updateStarsAtLevel: function(level) {\\r\\n      var rate = this.levelsScores[level] / this.levelsMaxScores[level];\\r\\n      var iLevel = this.levelsIdx[level];\\r\\n      var starsIdx = this.levelsRanks[level];\\r\\n      var mode = 'normal';\\r\\n      if (iLevel &gt;= this.unlockedLevels) {\\r\\n         mode = 'locked';\\r\\n      }\\r\\n      if (this.graderScore &gt; this.levelsMaxScores[level]) {\\r\\n         mode = 'useless';\\r\\n      }\\r\\n      drawStars('stars_' + starsIdx, starsIdx, 14, rate, mode);\\r\\n   },\\r\\n\\r\\n   updateLayout: function() {\\r\\n      if (!this.bUseFullWidth) {\\r\\n         return\\r\\n      }\\r\\n      $('#valider').appendTo($('#displayHelper_validate'));\\r\\n      if(window.innerWidth &gt;= 1200) {\\r\\n          $('#task').addClass('largeScreen');\\r\\n          $('#solution').addClass('largeScreen');\\r\\n          $('#displayHelperAnswering').appendTo($('#zone_1'));\\r\\n      }\\r\\n      else {\\r\\n         $('#task').removeClass('largeScreen');\\r\\n         $('#solution').removeClass('largeScreen');\\r\\n         if ($('#showSolutionButton')) {\\r\\n            $('#displayHelperAnswering').insertBefore($('#showSolutionButton'));\\r\\n         }\\r\\n         else {\\r\\n            $('#displayHelperAnswering').appendTo($('#task'));\\r\\n         }\\r\\n     }\\r\\n   },\\r\\n\\r\\n   useFullWidth: function() {\\r\\n      // TODO: find a clean way to do this\\r\\n      try {\\r\\n         $('#question-iframe', window.parent.document).css('width', '100%');\\r\\n      } catch(e) {\\r\\n      }\\r\\n      $('body').css('width', '100%');\\r\\n      // This try is probably not needed but avoid breaking just in case\\r\\n      try {\\r\\n         $(document).ready(function () {displayHelper.updateLayout();});\\r\\n         $(window).resize(function () {displayHelper.updateLayout();});\\r\\n         this.bUseFullWidth = true;\\r\\n      } catch(e) {\\r\\n      }\\r\\n   },\\r\\n\\r\\n   // Deprecated: use directly levelsMaxScores instead\\r\\n   getLevelsMaxScores: function() {\\r\\n      return this.levelsMaxScores;\\r\\n   },\\r\\n\\r\\n   displayLevel: function (newLevel, calledFromSet, isLocked) {\\r\\n      // Only displays a level, without requesting a level change to the task\\r\\n      if(!calledFromSet) {\\r\\n         this.taskLevel = newLevel;\\r\\n      }\\r\\n\\r\\n      if (this.popupMessageShown &amp;&amp; !isLocked) {\\r\\n         $('#popupMessage').hide();\\r\\n         $('#displayHelperAnswering, #taskContent').show();\\r\\n         this.popupMessageShown = false;\\r\\n      }\\r\\n\\r\\n      var allLevels = ['basic', 'easy', 'medium', 'hard'];\\r\\n      if(this.levelsRanks) {\\r\\n         for(var lr in this.levelsRanks) {\\r\\n            allLevels.push(lr);\\r\\n         }\\r\\n      }\\r\\n      for(var i=0; i &lt; allLevels.length; i++) {\\r\\n         var curLevel = allLevels[i];\\r\\n         $('#tab_' + curLevel).removeClass('current');\\r\\n         $('.' + curLevel).hide();\\r\\n      }\\r\\n      $('#tab_' + newLevel).addClass('current');\\r\\n      $('.' + newLevel).show();\\r\\n\\r\\n      // Add prev and next classes to .current direct siblings\\r\\n      $('#tabsMenu .li').removeClass('prev next');\\r\\n      $('#tabsMenu .li.current').prev().addClass('prev');\\r\\n      $('#tabsMenu .li.current').next().addClass('next');\\r\\n   },\\r\\n\\r\\n   setLevel: function(newLevel, force) {\\r\\n      // Check for locked level\\r\\n      var lockedLevel = $('#tab_' + newLevel).hasClass('lockedLevel');\\r\\n\\r\\n      // Always make sure we're displaying the level\\r\\n      this.displayLevel(newLevel, true, lockedLevel);\\r\\n\\r\\n      // Skip actually changing the level if we're already on this level\\r\\n      if (this.taskLevel == newLevel & <div class="js-module" id="js-module-button10" data-content="function drawButton(paper,xc,yc,w,h,params) {
   var defaultAttr = {
      rect: {
         stroke: &quot;none&quot;,
         fill: &quot;#4a90e2&quot;,
         r: h/2
      },
      text: {
         &quot;font-size&quot;: 14,
         &quot;font-weight&quot;: &quot;bold&quot;,
         fill: &quot;white&quot;
      },
      icon: {
         stroke: &quot;none&quot;,
         fill: &quot;white&quot;
      }
   };
   var attr = params.attr || defaultAttr;

   paper.setStart();
   var xRect = xc - w/2;
   var yRect = yc - h/2;
   paper.rect(xRect,yRect,w,h).attr(attr.rect);
   
   if(params.text){
      var xText = params.xText || xc;
      var yText = params.yText || yc;
      paper.text(xText,yText,params.text).attr(attr.text);
   }

   if(params.shape) {
      var iconR = params.iconR;
      var xIcon = params.xIcon || xRect + iconR;
      var yIcon = params.yIcon || yc;
      var shape = params.shape;
      var icon = getShape(paper, shape,xIcon,yIcon,{ radius: iconR });
      icon.attr(attr.icon);
      if(params.iconAngle){
         icon.attr(&quot;transform&quot;,[&quot;R&quot;,params.iconAngle]);
      }
   }

   if(params.imgSrc) {
      var src = params.imgSrc;
      var xIcon = params.xIcon;
      var iconW = params.iconW;
      var iconH = params.iconH;
      var yIcon = params.yIcon || yc - iconH/2;
      var icon = paper.image(src,xIcon,yIcon,iconW,iconW);
   }

   return paper.setFinish()
};"></div>
<div class="js-module" id="js-module-shapepaths11" data-content="function getShapePath(shape,x,y,params) {

        var yTr2 = y0 + h/2;

        var xRect = x0;
        var xTr1 = x0 + rectW;

    }
   
    var shapePaths = {

        star: [&quot;M&quot;, x, y - radius,
            &quot;L&quot;, x + 0.27 * radius, y -0.3 * radius,
            &quot;L&quot;, x + radius, y -0.3 * radius,
            &quot;L&quot;, x + 0.4 * radius, y + 0.2 * radius,

            &quot;L&quot;, x + 0, y +0.4 * radius,
            &quot;L&quot;, x - 0.6 * radius, y + 0.8 * radius,
            &quot;L&quot;, x - 0.4 * radius, y + 0.2 * radius,
            &quot;L&quot;, x - radius, y -0.3 * radius,
            &quot;L&quot;, x - 0.27 * radius, y -0.3 * radius,
            &quot;Z&quot;],
        triangle: [&quot;M&quot;, x-radius, y + radius,
            &quot;L&quot;, x + radius, y + radius,
            &quot;L&quot;, x, y - radius,
            &quot;Z&quot;],
        rectangle: [&quot;M&quot;, x-radius, y-radius,
            &quot;L&quot;, x+radius, y-radius,
            &quot;L&quot;, x+radius, y+radius,
            &quot;L&quot;, x-radius, y+radius,
            &quot;Z&quot;],
        reverseTriangle: [&quot;M&quot;, x-radius, y-radius,
            &quot;L&quot;, x+radius, y-radius,
            &quot;L&quot;, x, y+radius,
            &quot;Z&quot;],
        pentagon: [&quot;M&quot;, x, y-0.9*radius,
            &quot;L&quot;, x+radius, y-0.2 * radius,
            &quot;L&quot;, x+0.6 * radius, y+0.9*radius,
            &quot;L&quot;, x-0.6 * radius, y+0.9*radius,
            &quot;L&quot;, x-radius, y-0.2 * radius,
            &quot;Z&quot;],
        squareStar: [&quot;M&quot;, x, y-radius,
            &quot;L&quot;, x+0.25 * radius, y-0.25 * radius,
            &quot;L&quot;, x+radius, y,
            &quot;L&quot;, x+0.25 * radius, y+0.25 * radius,
            &quot;L&quot;, x+0, y+radius,
            &quot;L&quot;, x-0.25 * radius, y+0.25 * radius,
            &quot;L&quot;, x-radius, y,
            &quot;L&quot;, x-0.25 * radius, y-0.25 * radius,
            &quot;Z&quot;],
        roundedRectangle: [&quot;M&quot;, x-radius, y-radius + roundedRectangleRadius,
            &quot;Q&quot;, x-radius, y-radius, x-radius + roundedRectangleRadius, y-radius,
            &quot;L&quot;, x+radius -roundedRectangleRadius, y-radius,
            &quot;Q&quot;, x+radius, y-radius, x+radius, y-radius + roundedRectangleRadius,
            &quot;L&quot;, x+radius, y+radius - roundedRectangleRadius,
            &quot;Q&quot;, x+radius, y+radius, x+radius - roundedRectangleRadius, y+radius,
            &quot;L&quot;, x-radius + roundedRectangleRadius, y+radius,
            &quot;Q&quot;, x-radius, y+radius, x-radius, y+radius - roundedRectangleRadius,
            &quot;Z&quot;],
        heart: [&quot;M&quot;,x,(y + radius),
            &quot;C&quot;,(x - 1.5*radius),y,(x - radius),(y - radius*1.2),x,(y - radius/2),
            &quot;C&quot;,(x + radius),(y - radius*1.2),(x + 1.5*radius),y,x,(y + radius)],
        arrow: [&quot;M&quot;+xRect+&quot; &quot;+yRect+&quot;,H&quot;+xTr1+&quot;,V&quot;+yTr1+&quot;,L&quot;+xTr2+&quot; &quot;+yTr2+
         &quot;,L&quot;+xTr1+&quot; &quot;+yTr3+&quot;,V&quot;+(yRect + rectH)+&quot;,H&quot;+xRect+&quot;,Z&quot;],
        cross: [&quot;M&quot;, x - radius, y - radius, &quot;L&quot;, x + radius, y + radius, &quot;M&quot;, x - radius, y + radius, &quot;L&quot;, x + radius, y - radius ]
    };

}

function getShape(paper,shape,x,y,params) {

<div class="js-module" id="js-module-httpwwwfranceioiorgmodulespemFioigrid10js" data-content="function Grid(raphaelID, paper, rows, cols, cellWidth, cellHeight, gridLeft, gridTop, defaultLineAttr) {

   this.initCoordinates = function() {
